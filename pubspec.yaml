name: super_mall
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.0.0
  flutter_svg: ^2.0.17
  flutter_native_splash: ^2.4.4
  get_it: ^8.0.3
  carousel_slider: ^5.0.0
  dio: ^5.8.0+1
  equatable: ^2.0.5
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/vectors/
  - assets/fonts/
  # - assets/localization/

  fonts:
    - family: CircularStd
      fonts:
        - asset: assets/fonts/CircularStd-Book.ttf
        - asset: assets/fonts/CircularStd-Medium.ttf
          weight: 500
        - asset: assets/fonts/CircularStd-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#EBDBD0"
  image: assets/images/logo.png
  android: false
  ios: false  

  android_12:
    fullscreen: true
    icon_background_color: "#EBDBD0"
    image: assets/images/logo.png
    icon_background_color_dark: "#EBDBD0"
    image_dark: assets/images/logo.png